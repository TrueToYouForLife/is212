<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img"><title>C2 · ConnectSphere containers</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52647a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203047} .title{font-size:30px;font-weight:700} .head{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .edge{fill:none;stroke:#52647a;stroke-width:1.8;marker-end:url(#arrow)} </style><rect width="100%" height="100%" fill="#fff"/>
