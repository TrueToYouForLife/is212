<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 980" role="img"><title>Workflow Part 3 · Confirmation, delivery and completion</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52647a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203047} .title{font-size:30px;font-weight:700} .head{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .edge{fill:none;stroke:#52647a;stroke-width:1.8;marker-end:url(#arrow)} </style><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title" text-anchor="start">Workflow Part 3 · Confirmation, delivery and completion</text>
<text x="40" y="79" class="body" text-anchor="start">Continue from B. Registration is optional; staff preparation and attendee actions may happen alongside each other.</text>
<rect x="50" y="220" width="330" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="215.0" y="250" class="head" text-anchor="middle">Coordinator: confirm</text>
<text x="215.0" y="277" class="body" text-anchor="middle">B · Safety approved</text>
<text x="215.0" y="300" class="body" text-anchor="middle">Check essential arrangements remain ready</text>
<text x="215.0" y="323" class="body" text-anchor="middle">Confirm and notify relevant users</text>
<rect x="490" y="220" width="350" height="140" rx="10" fill="#fff8e9" stroke="#bc933b" stroke-width="1.5"/>
<text x="665.0" y="250" class="head" text-anchor="middle">Registration enabled?</text>
<text x="665.0" y="277" class="body" text-anchor="middle">Organiser sees confirmed arrangements</text>
<text x="665.0" y="300" class="body" text-anchor="middle">Coordinator controls registration</text>
<path class="edge" d="M380,290 L490,290"/>
<rect x="394" y="257" width="76.39999999999999" height="20" fill="white"/>
<text x="398" y="272" class="small" text-anchor="start">confirmed</text>
<rect x="950" y="120" width="380" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1140.0" y="150" class="head" text-anchor="middle">Attendee: register</text>
<text x="1140.0" y="177" class="body" text-anchor="middle">While confirmed and registration open</text>
<text x="1140.0" y="200" class="body" text-anchor="middle">Register, or join waitlist if full</text>
<text x="1140.0" y="223" class="body" text-anchor="middle">Receive confirmation and updates</text>
<path class="edge" d="M840,260 L890,260 L890,190 L950,190"/>
<rect x="902" y="160" width="30.799999999999997" height="20" fill="white"/>
<text x="906" y="175" class="small" text-anchor="start">yes</text>
<rect x="950" y="450" width="380" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1140.0" y="480" class="head" text-anchor="middle">Venue / Technical Staff: prepare</text>
<text x="1140.0" y="507" class="body" text-anchor="middle">Prepare approved venue and equipment</text>
<text x="1140.0" y="530" class="body" text-anchor="middle">Provide support for event delivery</text>
<path class="edge" d="M840,320 L890,320 L890,520 L950,520"/>
<rect x="654" y="412" width="175.2" height="20" fill="white"/>
<text x="658" y="427" class="small" text-anchor="start">no registration needed</text>
<path class="edge" d="M1140,260 L1140,365 L1540,365 L1540,450"/>
<rect x="1186" y="335" width="228.39999999999998" height="20" fill="white"/>
<text x="1190" y="350" class="small" text-anchor="start">attend when event takes place</text>
<path class="edge" d="M215,360 L215,655 L1040,655 L1040,590"/>
<rect x="286" y="625" width="433.59999999999997" height="20" fill="white"/>
<text x="290" y="640" class="small" text-anchor="start">staff prepare in parallel; do not wait for registrations</text>
<rect x="1460" y="450" width="300" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1610.0" y="480" class="head" text-anchor="middle">Event takes place</text>
<text x="1610.0" y="507" class="body" text-anchor="middle">Coordinator oversees delivery</text>
<text x="1610.0" y="530" class="body" text-anchor="middle">Attendees attend as applicable</text>
<path class="edge" d="M1330,520 L1460,520"/>
<rect x="1334" y="488" width="122.0" height="20" fill="white"/>
<text x="1338" y="503" class="small" text-anchor="start">resources ready</text>
<rect x="1840" y="450" width="310" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1995.0" y="480" class="head" text-anchor="middle">Completed</text>
<text x="1995.0" y="507" class="body" text-anchor="middle">Coordinator marks after event end</text>
<text x="1995.0" y="530" class="body" text-anchor="middle">Retain read-only event history</text>
<text x="1995.0" y="553" class="body" text-anchor="middle">Remove from active event lists</text>
<path class="edge" d="M1760,520 L1840,520"/>
<rect x="1771" y="488" width="46.0" height="20" fill="white"/>
<text x="1775" y="503" class="small" text-anchor="start">ended</text>
<rect x="1840" y="150" width="310" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1995.0" y="180" class="head" text-anchor="middle">Automatic completion</text>
<text x="1995.0" y="207" class="body" text-anchor="middle">If still Confirmed and not completed</text>
<text x="1995.0" y="230" class="body" text-anchor="middle">Complete 7 days after event end</text>
<path class="edge" d="M1660,450 L1660,220 L1840,220"/>
<rect x="1636" y="327" width="160.0" height="20" fill="white"/>
<text x="1640" y="342" class="small" text-anchor="start">not marked completed</text>
<path class="edge" d="M1995,290 L1995,450"/>
<rect x="2006" y="360" width="114.39999999999999" height="20" fill="white"/>
<text x="2010" y="375" class="small" text-anchor="start">7-day deadline</text>
<rect x="1460" y="720" width="690" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1805.0" y="750" class="head" text-anchor="middle">Technical Support: equipment return and follow-up</text>
<text x="1805.0" y="777" class="body" text-anchor="middle">Record returns, damage, missing items and operational status</text>
<text x="1805.0" y="800" class="body" text-anchor="middle">Update availability; prevent unusable units being reserved again</text>
<path class="edge" d="M1600,590 L1600,720"/>
<rect x="1611" y="648" width="144.79999999999998" height="20" fill="white"/>
<text x="1615" y="663" class="small" text-anchor="start">equipment returned</text>
<text x="45" y="895" class="body" text-anchor="start">Waiting list: offer a freed place in queue order; allow 3 days to accept. Withdrawal frees a place. Registration is optional.</text>
<text x="45" y="922" class="body" text-anchor="start">Equipment return is a separate operational follow-up, not an extra condition invented for marking the event Completed.</text>
<text x="40" y="956" class="small" text-anchor="start">Significant changes or resource problems can interrupt this journey: recheck affected arrangements and safety before proceeding.</text>
</svg>