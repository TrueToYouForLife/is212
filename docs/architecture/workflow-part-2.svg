<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1090" role="img"><title>Workflow Part 2 · Arrangements and safety</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52647a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203047} .title{font-size:30px;font-weight:700} .head{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .edge{fill:none;stroke:#52647a;stroke-width:1.8;marker-end:url(#arrow)} </style><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title" text-anchor="start">Workflow Part 2 · Arrangements and safety</text>
<text x="40" y="79" class="body" text-anchor="start">Continue from A. Venue and equipment work can run in parallel; BOTH must be ready before safety review.</text>
<rect x="45" y="410" width="320" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="205.0" y="440" class="head" text-anchor="middle">Coordinator: plan</text>
<text x="205.0" y="467" class="body" text-anchor="middle">A · Identify required spaces</text>
<text x="205.0" y="490" class="body" text-anchor="middle">and essential technical needs</text>
<rect x="500" y="190" width="390" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="695.0" y="220" class="head" text-anchor="middle">Venue Staff: review bookings</text>
<text x="695.0" y="247" class="body" text-anchor="middle">Coordinator searches / requests venues</text>
<text x="695.0" y="270" class="body" text-anchor="middle">Check each booking independently</text>
<text x="695.0" y="293" class="body" text-anchor="middle">Approve, or return reasons / alternatives</text>
<rect x="500" y="650" width="390" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="695.0" y="680" class="head" text-anchor="middle">Technical Support: reserve</text>
<text x="695.0" y="707" class="body" text-anchor="middle">Coordinator records requirements</text>
<text x="695.0" y="730" class="body" text-anchor="middle">Check operational stock and availability</text>
<text x="695.0" y="753" class="body" text-anchor="middle">Reserve, or propose alternatives</text>
<path class="edge" d="M365,450 L415,450 L415,260 L500,260"/>
<rect x="423" y="229" width="84.0" height="20" fill="white"/>
<text x="427" y="244" class="small" text-anchor="start">venue work</text>
<path class="edge" d="M365,490 L415,490 L415,720 L500,720"/>
<rect x="421" y="689" width="114.39999999999999" height="20" fill="white"/>
<text x="425" y="704" class="small" text-anchor="start">equipment work</text>
<rect x="1000" y="410" width="380" height="140" rx="10" fill="#fff8e9" stroke="#bc933b" stroke-width="1.5"/>
<text x="1190.0" y="440" class="head" text-anchor="middle">All arrangements ready?</text>
<text x="1190.0" y="467" class="body" text-anchor="middle">Every required venue approved</text>
<text x="1190.0" y="490" class="body" text-anchor="middle">All essential equipment reserved</text>
<text x="1190.0" y="513" class="body" text-anchor="middle">No unresolved arrangement issues</text>
<path class="edge" d="M890,260 L965,260 L965,450 L1000,450"/>
<rect x="1006" y="257" width="114.39999999999999" height="20" fill="white"/>
<text x="1010" y="272" class="small" text-anchor="start">venue outcomes</text>
<path class="edge" d="M890,720 L965,720 L965,510 L1000,510"/>
<rect x="1006" y="704" width="251.2" height="20" fill="white"/>
<text x="1010" y="719" class="small" text-anchor="start">technical outcomes / none needed</text>
<rect x="500" y="410" width="390" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="695.0" y="440" class="head" text-anchor="middle">Coordinator: revise plans</text>
<text x="695.0" y="467" class="body" text-anchor="middle">Resolve rejections or shortages</text>
<text x="695.0" y="490" class="body" text-anchor="middle">Change affected requests / alternatives</text>
<path class="edge" d="M1000,480 L890,480"/>
<rect x="898" y="451" width="76.39999999999999" height="20" fill="white"/>
<text x="902" y="466" class="small" text-anchor="start">not ready</text>
<path class="edge" d="M635,410 L635,330"/>
<rect x="451" y="357" width="167.6" height="20" fill="white"/>
<text x="455" y="372" class="small" text-anchor="start">revised venue request</text>
<path class="edge" d="M735,530 L735,650"/>
<rect x="441" y="595" width="236.0" height="20" fill="white"/>
<text x="445" y="610" class="small" text-anchor="start">revised equipment requirements</text>
<rect x="1510" y="410" width="390" height="140" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1705.0" y="440" class="head" text-anchor="middle">Safety Officer: review</text>
<text x="1705.0" y="467" class="body" text-anchor="middle">Awaiting Safety Review</text>
<text x="1705.0" y="490" class="body" text-anchor="middle">Assess operational safety factors</text>
<text x="1705.0" y="513" class="body" text-anchor="middle">Record approval or required revisions</text>
<path class="edge" d="M1380,470 L1510,470"/>
<rect x="1398" y="440" width="76.39999999999999" height="20" fill="white"/>
<text x="1402" y="455" class="small" text-anchor="start">all ready</text>
<rect x="1510" y="790" width="390" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1705.0" y="820" class="head" text-anchor="middle">Coordinator: safety revisions</text>
<text x="1705.0" y="847" class="body" text-anchor="middle">Receive reasons and named issues</text>
<text x="1705.0" y="870" class="body" text-anchor="middle">Revise affected arrangements</text>
<path class="edge" d="M1705,550 L1705,790"/>
<rect x="1716" y="659" width="190.39999999999998" height="20" fill="white"/>
<text x="1720" y="674" class="small" text-anchor="start">reject / request changes</text>
<path class="edge" d="M1510,850 L935,850 L935,600 L840,600 L840,530"/>
<rect x="1036" y="870" width="426.0" height="20" fill="white"/>
<text x="1040" y="885" class="small" text-anchor="start">revise, regain approvals and resubmit through readiness</text>
<rect x="1970" y="410" width="190" height="140" rx="10" fill="#e6f4f2" stroke="#4a8d85" stroke-width="1.5"/>
<text x="2065.0" y="440" class="head" text-anchor="middle">B · Safety approved</text>
<text x="2065.0" y="467" class="body" text-anchor="middle">May enter preparation</text>
<text x="2065.0" y="490" class="body" text-anchor="middle">Go to Workflow Part 3</text>
<path class="edge" d="M1900,470 L1970,470"/>
<rect x="1900" y="436" width="61.199999999999996" height="20" fill="white"/>
<text x="1904" y="451" class="small" text-anchor="start">approve</text>
<text x="45" y="977" class="body" text-anchor="start">Venue work includes multiple bookings, optional expiring holds, availability and suitability checks, plus setup / turnaround time.</text>
<text x="45" y="1004" class="body" text-anchor="start">Rejecting one venue does not cancel other bookings. Safety rejection returns affected plans for revision; preparation / confirmation stays blocked.</text>
<text x="45" y="1031" class="body" text-anchor="start">Expired holds free availability; resource problems and significant changes require affected arrangements to be rechecked.</text>
<text x="40" y="1066" class="small" text-anchor="start">Booking granularity: 15 minutes. All required venue and technical arrangements must be ready; this gate is not an either/or choice.</text>
</svg>