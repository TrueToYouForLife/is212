<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 920" role="img"><title>Workflow Part 1 · Request and review</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52647a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203047} .title{font-size:30px;font-weight:700} .head{font-size:19px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .edge{fill:none;stroke:#52647a;stroke-width:1.8;marker-end:url(#arrow)} </style><rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title" text-anchor="start">Workflow Part 1 · Request and review</text>
<text x="40" y="79" class="body" text-anchor="start">Roles are written in each action. Follow labelled arrows; continuation A opens the arrangements sheet.</text>
<rect x="60" y="200" width="290" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="205.0" y="230" class="head" text-anchor="middle">Organiser: draft</text>
<text x="205.0" y="257" class="body" text-anchor="middle">Create, save and reopen</text>
<text x="205.0" y="280" class="body" text-anchor="middle">Complete request details</text>
<rect x="450" y="200" width="290" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="595.0" y="230" class="head" text-anchor="middle">Organiser: submit</text>
<text x="595.0" y="257" class="body" text-anchor="middle">Validate required information</text>
<text x="595.0" y="280" class="body" text-anchor="middle">Enter unassigned queue</text>
<rect x="850" y="200" width="290" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="995.0" y="230" class="head" text-anchor="middle">Lead: assign</text>
<text x="995.0" y="257" class="body" text-anchor="middle">Review basic request details</text>
<text x="995.0" y="280" class="body" text-anchor="middle">Choose an Event Coordinator</text>
<rect x="1250" y="200" width="290" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1395.0" y="230" class="head" text-anchor="middle">Coordinator: review</text>
<text x="1395.0" y="257" class="body" text-anchor="middle">Review the full request</text>
<text x="1395.0" y="280" class="body" text-anchor="middle">Record a reasoned decision</text>
<rect x="1750" y="200" width="370" height="120" rx="10" fill="#fff8e9" stroke="#bc933b" stroke-width="1.5"/>
<text x="1935.0" y="230" class="head" text-anchor="middle">Review outcome?</text>
<text x="1935.0" y="257" class="body" text-anchor="middle">Approve, clarify or reject</text>
<path class="edge" d="M350,260 L450,260"/>
<rect x="367" y="230" width="53.599999999999994" height="20" fill="white"/>
<text x="371" y="245" class="small" text-anchor="start">submit</text>
<path class="edge" d="M740,260 L850,260"/>
<rect x="771" y="230" width="46.0" height="20" fill="white"/>
<text x="775" y="245" class="small" text-anchor="start">valid</text>
<path class="edge" d="M1140,260 L1250,260"/>
<rect x="1155" y="230" width="68.8" height="20" fill="white"/>
<text x="1159" y="245" class="small" text-anchor="start">assigned</text>
<path class="edge" d="M1540,260 L1750,260"/>
<rect x="1565" y="230" width="122.0" height="20" fill="white"/>
<text x="1569" y="245" class="small" text-anchor="start">record decision</text>
<path class="edge" d="M590,200 L590,145 L205,145 L205,200"/>
<rect x="276" y="117" width="312.0" height="20" fill="white"/>
<text x="280" y="132" class="small" text-anchor="start">missing / invalid details: correct draft</text>
<rect x="1250" y="490" width="370" height="120" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1435.0" y="520" class="head" text-anchor="middle">Organiser: clarify</text>
<text x="1435.0" y="547" class="body" text-anchor="middle">Answer Coordinator’s questions</text>
<text x="1435.0" y="570" class="body" text-anchor="middle">Resubmit for another review</text>
<path class="edge" d="M1810,320 L1810,390 L1435,390 L1435,490"/>
<rect x="1506" y="360" width="182.79999999999998" height="20" fill="white"/>
<text x="1510" y="375" class="small" text-anchor="start">clarification requested</text>
<path class="edge" d="M1250,550 L1200,550 L1200,365 L1320,365 L1320,320"/>
<rect x="873" y="385" width="236.0" height="20" fill="white"/>
<text x="877" y="400" class="small" text-anchor="start">answers received: review again</text>
<rect x="1750" y="490" width="370" height="120" rx="10" fill="#f0f1f4" stroke="#929baa" stroke-width="1.5"/>
<text x="1935.0" y="520" class="head" text-anchor="middle">Request rejected</text>
<text x="1935.0" y="547" class="body" text-anchor="middle">Notify Organiser of reasons</text>
<text x="1935.0" y="570" class="body" text-anchor="middle">Retain history; stop planning</text>
<path class="edge" d="M2120,260 L2160,260 L2160,550 L2120,550"/>
<rect x="2086" y="415" width="53.599999999999994" height="20" fill="white"/>
<text x="2090" y="430" class="small" text-anchor="start">reject</text>
<rect x="1750" y="710" width="370" height="90" rx="10" fill="#e6f4f2" stroke="#4a8d85" stroke-width="1.5"/>
<text x="1935.0" y="740" class="head" text-anchor="middle">A · Begin planning</text>
<text x="1935.0" y="767" class="body" text-anchor="middle">Continue on Workflow Part 2</text>
<path class="edge" d="M1940,320 L1940,450 L1710,450 L1710,755 L1750,755"/>
<rect x="1714" y="654" width="61.199999999999996" height="20" fill="white"/>
<text x="1718" y="669" class="small" text-anchor="start">approve</text>
<rect x="450" y="490" width="370" height="120" rx="10" fill="#f0f1f4" stroke="#929baa" stroke-width="1.5"/>
<text x="635.0" y="520" class="head" text-anchor="middle">Coordinator: withdraw</text>
<text x="635.0" y="547" class="body" text-anchor="middle">If under-review withdrawal is chosen</text>
<text x="635.0" y="570" class="body" text-anchor="middle">Close request and retain history</text>
<path class="edge" d="M1250,295 L1170,295 L1170,460 L635,460 L635,490"/>
<rect x="681" y="430" width="289.2" height="20" fill="white"/>
<text x="685" y="445" class="small" text-anchor="start">withdraw instead of continuing review</text>
<text x="45" y="840" class="body" text-anchor="start">Submission and clarification replies show In review to the Organiser. Questions show Clarification required.</text>
<text x="45" y="867" class="body" text-anchor="start">Assignment and decisions notify relevant recipients. Request approval alone does not reserve venues or equipment.</text>
<text x="40" y="896" class="small" text-anchor="start">Whole-project target • Sources: Week 1 / 4 / 7 requirements and current supplied backlog • Named continuation points are navigation, not system components.</text>
</svg>