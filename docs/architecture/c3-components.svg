<text x="1850.0" y="1217" class="body" text-anchor="middle">Check required arrangements; explicitly send</text>
<text x="1850.0" y="1240" class="body" text-anchor="middle">Officer decision; revisions and resubmission</text>
<text x="1850.0" y="1263" class="body" text-anchor="middle">Open reviews block readiness; registration exempt</text>
<rect x="100" y="1600" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="350.0" y="1630" class="head" text-anchor="middle">Event Lifecycle Module</text>
<text x="350.0" y="1657" class="body" text-anchor="middle">Plan, postpone, reschedule, cancel and complete</text>
<text x="350.0" y="1680" class="body" text-anchor="middle">Confirmed summaries and event audit display</text>
<rect x="850" y="1600" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1100.0" y="1630" class="head" text-anchor="middle">Registration Module</text>
<text x="1100.0" y="1657" class="body" text-anchor="middle">Enable registration; confirmed-event capacity</text>
<text x="1100.0" y="1680" class="body" text-anchor="middle">Register, withdraw, waiting offers and visibility</text>
<rect x="1600" y="1600" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1850.0" y="1630" class="head" text-anchor="middle">Notification Module</text>
