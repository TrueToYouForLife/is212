<text x="350.0" y="407" class="body" text-anchor="middle">Create, save, reopen and submit requests</text>
<text x="350.0" y="430" class="body" text-anchor="middle">Status, organisation scope and clarification replies</text>
<rect x="850" y="350" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1100.0" y="380" class="head" text-anchor="middle">Change Request Module</text>
<text x="1100.0" y="407" class="body" text-anchor="middle">Propose changes; answer field clarification</text>
<text x="1100.0" y="430" class="body" text-anchor="middle">Retain requested values, replies and outcomes</text>
<rect x="1600" y="350" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
