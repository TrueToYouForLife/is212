<rect x="100" y="730" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="350.0" y="760" class="head" text-anchor="middle">Assignment Module</text>
<text x="350.0" y="787" class="body" text-anchor="middle">Lead assigns / reassigns Coordinators</text>
<text x="350.0" y="810" class="body" text-anchor="middle">Unassigned queue, active events and workloads</text>
<text x="350.0" y="833" class="body" text-anchor="middle">Assigned-only management</text>
<rect x="850" y="730" width="500" height="160" rx="10" fill="#eef4ff" stroke="#7a99c5" stroke-width="1.5"/>
<text x="1100.0" y="760" class="head" text-anchor="middle">Event Review Module</text>
<text x="1100.0" y="787" class="body" text-anchor="middle">Review, approve, reject or clarify requests</text>
<text x="1100.0" y="810" class="body" text-anchor="middle">Read clarification replies and decision history</text>
<text x="1100.0" y="833" class="body" text-anchor="middle">Approval starts planning</text>
