name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Every run step below is an npm script, and they all live in the frontend package.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not npm install: it installs exactly the locked versions, so CI cannot
      # pass on a dependency tree no one has on their machine.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage
        env:
          TZ: 'Asia/Singapore'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Save frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error

      # The build needs the VITE_ variables to exist, not to be real: src/lib/supabase.ts
      # throws at import time when they are missing.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key



  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Disposable Postgres 17 in Docker; never touches a Supabase project.
      - name: Database tests
        run: bash backend/supabase/tests/run_change_request_review.sh
